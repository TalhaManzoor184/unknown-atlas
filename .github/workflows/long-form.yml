name: Long-form documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id from content/topics.yaml (blank = next in queue)"
        required: false
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true
      publish_mode:
        description: "private / scheduled / public (blank = repo variable or config.yaml)"
        required: false

concurrency:
  group: unknown-atlas-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest main, so queued runs see state committed by the previous run

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (with libass for burned-in captions)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig
          ffmpeg -hide_banner -filters | grep -q " ass " || (echo "ffmpeg has no ass filter" && exit 1)

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build and publish documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          VOICE_NAME: ${{ vars.VOICE_NAME }}
          AI_IMAGES: ${{ vars.AI_IMAGES }}
          TOPIC: ${{ inputs.topic }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          ARGS=(long)
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          if [ "$UPLOAD" = "false" ]; then ARGS+=(--no-upload); fi
          mkdir -p output
          set -o pipefail
          PYTHONUNBUFFERED=1 python -m pipeline.main "${ARGS[@]}" 2>&1 | tee output/run.log

      - name: Keep video package as artifact
        if: always()
        continue-on-error: true # a full artifact quota must not fail the run
        uses: actions/upload-artifact@v5
        with:
          name: documentary-${{ github.run_number }}
          path: |
            output/*/*.mp4
            output/*/thumbnail.jpg
            output/**/package.md
            output/**/package.json
            output/**/description.txt
            output/*/captions.en.srt
          retention-days: 1
          if-no-files-found: ignore

      - name: Save run log to run-logs branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          set +e
          D="$RUNNER_TEMP/run-logs" && mkdir -p "$D" && cd "$D"
          git init -q && git config user.name "unknown-atlas-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin run-logs; then git checkout -q -B run-logs FETCH_HEAD; else git checkout -q --orphan run-logs; fi
          N="${{ github.run_id }}-long"
          mkdir -p "logs/$N"
          cp "$GITHUB_WORKSPACE/output/run.log" "logs/$N/run.log" 2>/dev/null || echo "no log produced" > "logs/$N/run.log"
          find "$GITHUB_WORKSPACE/output" -maxdepth 2 \( -name package.md -o -name description.txt \) -exec cp {} "logs/$N/" \; 2>/dev/null
          git add -A && git commit -qm "run log $N" && git push -q origin run-logs
          exit 0

      - name: Commit state, research and package log
        if: always()
        run: |
          git config user.name "unknown-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state content
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish log (long-form) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
